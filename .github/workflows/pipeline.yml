name: Validate, build and deploy to Oracle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a deployment halfway through a database snapshot or replacement.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Tests, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install frozen dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci --no-audit --no-fund
      - name: Type checking
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Compile
        run: npm run build
      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh deploy/remote-deploy.sh
          shellcheck scripts/*.sh deploy/remote-deploy.sh

  image:
    name: Container smoke test and multiarch publication
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.reference.outputs.reference }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build native image for validation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: bible-daily-events:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test with Docker Compose
        env:
          APP_IMAGE: bible-daily-events:ci
        run: bash scripts/container-smoke.sh
      - name: Define registry image
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Publish amd64 and arm64 image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export immutable image reference
        id: reference
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "reference=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Image: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy via SSH to Oracle VM
    needs: image
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_REF: ${{ needs.image.outputs.reference }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Environment-scoped secrets/variables exist here, not in the job-level if.
      - name: Resolve deployment activation
        id: activation
        env:
          DEPLOY_ENABLED: ${{ secrets.ENABLE_ORACLE_DEPLOY || vars.ENABLE_ORACLE_DEPLOY || 'false' }}
        run: bash scripts/resolve-deploy-gate.sh
      - name: Configure verified SSH
        if: steps.activation.outputs.deploy == 'enabled'
        env:
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT || vars.ORACLE_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.ORACLE_DEPLOY_PATH || vars.ORACLE_DEPLOY_PATH || '/opt/bible-daily-events' }}
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 2; }
          [[ "$ORACLE_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || fail 'ORACLE_HOST ausente ou inválido: use apenas IP/hostname, sem https:// ou porta.'
          [[ "$ORACLE_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || fail 'ORACLE_USER ausente ou inválido no environment production.'
          [[ "$ORACLE_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || fail 'ORACLE_SSH_PORT precisa ser uma porta numérica.'
          (( 10#$ORACLE_SSH_PORT > 0 && 10#$ORACLE_SSH_PORT <= 65535 )) || fail 'ORACLE_SSH_PORT fora do intervalo 1–65535.'
          ORACLE_SSH_PORT=$((10#$ORACLE_SSH_PORT))
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_/-]+$ && "$DEPLOY_PATH" != / && "$DEPLOY_PATH" != *..* ]] || fail 'ORACLE_DEPLOY_PATH precisa ser um caminho absoluto, sem espaços ou .. .'
          [[ -n "$SSH_PRIVATE_KEY" ]] || fail 'ORACLE_SSH_PRIVATE_KEY não está disponível neste environment.'
          [[ -n "$SSH_KNOWN_HOSTS" ]] || fail 'ORACLE_SSH_KNOWN_HOSTS não está disponível neste environment.'
          [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]] || fail 'A etapa image não retornou um digest GHCR válido.'
          install -m 700 -d "$RUNNER_TEMP/oracle-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/oracle-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/oracle-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/oracle-ssh/"*
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/oracle-ssh/key" > /dev/null || fail 'Chave privada SSH inválida ou protegida por passphrase; use a chave privada OpenSSH completa.'
          known_host="$ORACLE_HOST"
          if [[ "$ORACLE_SSH_PORT" != 22 ]]; then known_host="[$ORACLE_HOST]:$ORACLE_SSH_PORT"; fi
          ssh-keygen -F "$known_host" -f "$RUNNER_TEMP/oracle-ssh/known_hosts" > /dev/null || fail 'ORACLE_SSH_KNOWN_HOSTS não contém a entrada do host/porta configurados.'
          printf 'ORACLE_SSH_PORT=%s\nDEPLOY_PATH=%s\n' "$ORACLE_SSH_PORT" "$DEPLOY_PATH" >> "$GITHUB_ENV"
      - name: Upload release and deploy
        if: steps.activation.outputs.deploy == 'enabled'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$RUNNER_TEMP/oracle-ssh/key" -o "UserKnownHostsFile=$RUNNER_TEMP/oracle-ssh/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          target="$ORACLE_USER@$ORACLE_HOST"
          release="$DEPLOY_PATH/releases/$RELEASE_ID"
          echo 'Validando autenticação SSH e pré-requisitos na VM Oracle...'
          ssh "${ssh_options[@]}" -p "$ORACLE_SSH_PORT" "$target" "bash -s -- '$DEPLOY_PATH'" <<'REMOTE'
          set -euo pipefail
          root=$1
          for tool in docker python3 flock; do
            command -v "$tool" >/dev/null || { echo "Pré-requisito ausente na VM: $tool" >&2; exit 2; }
          done
          docker info >/dev/null 2>&1 || { echo 'O usuário SSH não consegue acessar o Docker. Confira o serviço e a permissão do grupo docker.' >&2; exit 2; }
          docker compose version >/dev/null || { echo 'Plugin Docker Compose indisponível na VM.' >&2; exit 2; }
          [[ -d "$root" && -w "$root" ]] || { echo 'Diretório de deploy ausente ou sem permissão de escrita. Prepare ORACLE_DEPLOY_PATH conforme docs/DEPLOYMENT.md.' >&2; exit 2; }
          for file in app.env compose.env event-sources.json; do
            [[ -r "$root/shared/$file" ]] || { echo "Configure o arquivo shared/$file na VM conforme docs/DEPLOYMENT.md." >&2; exit 2; }
          done
          echo 'SSH autenticado e pré-requisitos da VM conferidos.'
          REMOTE
          ssh "${ssh_options[@]}" -p "$ORACLE_SSH_PORT" "$target" "umask 077; mkdir -p '$release/deploy'"
          scp "${ssh_options[@]}" -P "$ORACLE_SSH_PORT" docker-compose.yml "$target:$release/docker-compose.yml"
          scp "${ssh_options[@]}" -P "$ORACLE_SSH_PORT" deploy/Caddyfile deploy/remote-deploy.sh "$target:$release/deploy/"
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" -p "$ORACLE_SSH_PORT" "$target" \
            "bash '$release/deploy/remote-deploy.sh' '$DEPLOY_PATH' '$RELEASE_ID' '$IMAGE_REF' '$GHCR_USER'"
          echo "Oracle release: \`$RELEASE_ID\` — \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH material from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/oracle-ssh"
